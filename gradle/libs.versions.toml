kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin-kapt-version" }
kotlinJsonSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinJsonSerialization-version" }
